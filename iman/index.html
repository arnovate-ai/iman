<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iman Gadzhi – MacBook Giveaway Proof</title>
  <meta name="description" content="Proof of participation in the Iman Gadzhi MacBook giveaway." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(99, 70, 255, 0.15), transparent),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(0, 200, 150, 0.08), transparent);
      overflow-x: hidden;
      padding: 2rem 1rem;
    }

    /* Floating ambient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
      animation: float 8s ease-in-out infinite alternate;
    }

    .orb--1 {
      width: 400px;
      height: 400px;
      background: #6346ff;
      top: -100px;
      left: -100px;
      animation-duration: 10s;
    }

    .orb--2 {
      width: 300px;
      height: 300px;
      background: #00c896;
      bottom: -80px;
      right: -80px;
      animation-duration: 12s;
      animation-delay: 2s;
    }

    @keyframes float {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.08); }
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 2.5rem 2rem 2rem;
      max-width: 460px;
      width: 100%;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 80px rgba(99, 70, 255, 0.08);
      animation: cardIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card__badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 70, 255, 0.15);
      border: 1px solid rgba(99, 70, 255, 0.3);
      color: #a78bfa;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 1.25rem;
    }

    .card__badge::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #6346ff;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(1.4); }
    }

    .card__title {
      color: #f0f0f5;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }

    .card__subtitle {
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.9rem;
      font-weight: 400;
      margin-bottom: 1.75rem;
    }

    /* Screenshot container */
    .screenshot-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      animation: imgIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
    }

    @keyframes imgIn {
      0% {
        opacity: 0;
        transform: scale(0.94);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .screenshot-wrap img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .screenshot-wrap:hover img {
      transform: scale(1.02);
    }

    /* Shine effect on hover */
    .screenshot-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent 40%,
        rgba(255, 255, 255, 0.03) 45%,
        rgba(255, 255, 255, 0.06) 50%,
        rgba(255, 255, 255, 0.03) 55%,
        transparent 60%
      );
      transform: translateX(-100%);
      transition: transform 0.7s ease;
      pointer-events: none;
    }

    .screenshot-wrap:hover::after {
      transform: translateX(100%);
    }

    /* Footer note */
    .card__footer {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 1.25rem;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.78rem;
    }

    .card__footer svg {
      flex-shrink: 0;
      opacity: 0.4;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card {
        padding: 1.5rem 1.25rem 1.25rem;
        border-radius: 18px;
      }

      .card__title {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient background orbs -->
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>

  <main class="card" id="main-card">
    <span class="card__badge">Verified Chat</span>
    <h1 class="card__title">Iman Gadzhi</h1>
    <p class="card__subtitle">WhatsApp conversation &middot; MacBook Giveaway</p>

    <div class="screenshot-wrap" id="screenshot">
      <img
        src="chat.png"
        alt="WhatsApp chat screenshot with Iman Gadzhi about a MacBook giveaway participation"
        loading="eager"
      />
    </div>

    <div class="card__footer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span>7:21 – 7:22 AM &middot; Screenshot</span>
    </div>
  </main>
</body>
</html>
